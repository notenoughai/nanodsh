name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: desensitization scan
        run: |
          base="${GITHUB_BASE_REF:-}"
          if [ -n "$base" ]; then
            git fetch --no-tags origin "refs/heads/$base:refs/remotes/origin/$base"
            range="origin/$base..$GITHUB_SHA"
          else
            before=$(node -e 'const e=JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));process.stdout.write(e.before??"")')
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              range="$before..$GITHUB_SHA"
            else
              range="$GITHUB_SHA --not --remotes"
            fi
          fi
          node scripts/desens.mjs --range "$range" --required-secrets
      - name: check
        run: pnpm check
      - name: test
        run: pnpm test
      - name: pack smoke
        run: |
          mkdir -p /tmp/pack
          pnpm --filter @nanodsh/core pack --pack-destination /tmp/pack
          pnpm --filter @nanodsh/cli pack --pack-destination /tmp/pack
          core=$(ls /tmp/pack/nanodsh-core-*.tgz)
          cli=$(ls /tmp/pack/nanodsh-cli-*.tgz)
          for tarball in "$core" "$cli"; do
            if tar -tzf "$tarball" | grep -qE '^package/(test|scripts)/'; then
              echo "the tarball must not carry tests or scripts: $tarball" >&2
              exit 1
            fi
            if ! tar -tzf "$tarball" | grep -qx 'package/README.md'; then
              echo "the tarball must carry a README: $tarball" >&2
              exit 1
            fi
          done
          tar -xzOf "$core" package/package.json > /tmp/core-manifest.json
          tar -xzOf "$cli" package/package.json > /tmp/cli-manifest.json
          node -e 'const fs=require("fs");for (const [name,file] of [["@nanodsh/core","/tmp/core-manifest.json"],["@nanodsh/cli","/tmp/cli-manifest.json"]]){const m=JSON.parse(fs.readFileSync(file,"utf8"));const source=JSON.parse(fs.readFileSync("packages/"+name.split("/")[1]+"/package.json","utf8"));if(m.name!==name){throw new Error("unexpected package name "+m.name)}if(m.publishConfig?.access!=="public"){throw new Error(name+" must publish as public")}if(m.version!==source.version){throw new Error(name+" tarball version differs from packages/"+name.split("/")[1])}}'
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm install "$core" "$cli" --no-audit --no-fund >/dev/null
          ./node_modules/.bin/nanodsh --version
          node --input-type=module -e "import('@nanodsh/core').then((m) => { if (typeof m.selectHome !== 'function') throw new Error('@nanodsh/core does not export selectHome') })"