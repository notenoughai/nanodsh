name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: desensitization scan
        run: |
          base="${GITHUB_BASE_REF:-}"
          if [ -n "$base" ]; then
            git fetch --no-tags origin "refs/heads/$base:refs/remotes/origin/$base"
            range="origin/$base..$GITHUB_SHA"
          else
            before=$(node -e 'const e=JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));process.stdout.write(e.before??"")')
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              range="$before..$GITHUB_SHA"
            else
              range="$GITHUB_SHA --not --remotes"
            fi
          fi
          node scripts/desens.mjs --range "$range" --required-secrets
      - name: check
        run: pnpm check
      - name: test
        run: pnpm test
      - name: pack smoke
        run: |
          mkdir -p /tmp/pack
          pnpm pack --pack-destination /tmp/pack
          tarball=$(ls /tmp/pack/*.tgz)
          if tar -tzf "$tarball" | grep -qE '^package/(test|scripts)/'; then
            echo "the tarball must not carry tests or scripts" >&2
            exit 1
          fi
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm install "$tarball" --no-audit --no-fund >/dev/null
          ./node_modules/.bin/nanodsh --version
